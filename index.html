<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mitosis Simulation</title>
    <style>
        :root{
            --bg:#fff;
            --fg:#000;
            --muted:#333;
            --panel:#fff;
            --line:#d4d4d8;
            --cell:#f7f8fc;
            --cellline:#9aa3b8;
            --nuc:#0284c7;
            color-scheme:light;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top, 0px);
            padding-bottom:env(safe-area-inset-bottom, 0px);
        }
        html{
            height:100%;
            scroll-padding-top:env(safe-area-inset-top, 0px);
        }
        body{
            min-height:100%;
            margin:0;
            background:var(--bg);
            color:var(--fg);
            font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .app{
            display:flex;
            flex-direction:column;
            min-height:100%;
        }
        .stage{
            display:flex;
            flex-direction:column;
            flex:0 0 auto;
        }
        .steps{
            display:flex;
            gap:6px;
            padding:10px 10px 6px;
        }
        .step{
            flex:1;
            min-width:0;
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--muted);
            border-radius:12px;
            padding:8px 2px; 
            font:600 clamp(10px, 2.8vw, 14px) inherit;
            font-family:inherit;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:3px;
            transition:all 0.3s;
        }
        .step i{
            width:8px;
            height:8px;
            border-radius:50%;
            background:var(--c);
            opacity:0.5;
            transition:all 0.3s;
            font-style:normal;
            display:none;
        }
        .step.on{
            color:var(--fg);
            border-color:var(--c);
            background:color-mix(in srgb, var(--c) 20%, var(--panel));
        }
        .step.on i{
            opacity:1;
            box-shadow:0 0 10px var(--c);
            transform:scale(1.4);
            display:none;
        }
        main{
            height:clamp(300px, 46vh, 540px);
            position:relative;
        }
        canvas{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            touch-action:manipulation;
        }
        .ctrl{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            align-items:center;
            gap:8px;
            padding:8px 10px 2px;
        }
        .hint{
            margin:2px 0 10px;
            text-align:center;
            font-size:12px;
            color:var(--muted);
        }
        .btn{
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--fg);
            border-radius:10px;
            padding:8px 14px;
            font:inherit;
            font-size:14px;
            cursor:pointer;
        }
        .btn:active{
            transform:scale(0.96);
        }
        .btn.main{
            background:#6366f1;
            border-color:#6366f1;
            color:#fff;
        }
        .cnt{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:13px;
            color:var(--muted);
        }
        .cnt .btn{
            padding:6px 11px;
        }
        .cnt input{
            width:60px;
            text-align:center;
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--fg);
            border-radius:10px;
            padding:7px 4px;
            font:inherit;
            font-size:16px;
        }
        .box{
            padding:14px;
            border-top:1px solid var(--line);
        }
        .fhead{
            display:flex;
            align-items:baseline;
            justify-content:space-between;
            gap:10px;
        }
        #formula{
            font-weight:800;
            font-size:clamp(28px, 7vw, 38px);
            line-height:1.1;
        }
        #formula small{
            display:block;
            font-size:12px;
            font-weight:600;
            color:var(--muted);
            margin:2px;
        }
        #phname{
            font-weight:800;
            font-size:clamp(16px, 4.4vw, 20px);
        }
        #phtxt{
            font-size:13px;
            color:var(--muted);
            margin:6px 0 12px;
            line-height:1.4;
        }
        .q{
            border:1px solid var(--line);
            border-radius:12px;
            padding:8px 10px;
            margin-bottom:8px;
            transition:background 0.2s, border-color 0.2s;
        }
        .q.ok{
            border-color:green;
            background:#f0fdf4;
        }
        .q.bad{
            border-color:red;
            background:#fef2f2;
        }
        .qr{
            display:flex;
            align-items:center;
            gap:8px;
        }
        .qr label{
            flex:1;
            font-size:14px;
            line-height:1.3;
        }
        .qr input{
            width:64px;
            text-align:center;
            font:inherit;
            font-size:16px;
            font-weight:700;
            border:1px solid var(--line);
            border-radius:10px;
            padding:6px 4px;
            background:#fff;
            color:#000;
        }
        .mark{
            width:20px;
            text-align:center;
            font-weight:800;
        }
        .msg{
            display:none;
            font-size:12.5px;
            line-height:1.35;
            margin-top:6px;
        }
        .q.ok .msg{
            display:block;
            color:black;
        }
        .q.bad .msg{
            display:block;
            color:black;
        }
        #fb{
            display:flex;
            justify-content:space-between;
            gap:10px;
            font-size:14px;
            font-weight:600;
            padding:10px 12px;
            border-radius:12px;
            background:#f4f4f5;
        }
        #fb.done{
            background:#f4f4f5;
            color:black;
        }
        @media(min-width:900px){
            body{
                height:100%;
                overflow:hidden;
            }
            .app{
                flex-direction:row;
                height:100%;
            }
            .stage{
                flex:1;
                min-width:0;
            }
            main{
                flex:1;
                height:auto;
                min-height:0;
            }
            .box{
                flex:0 0 390px;
                width:390px;
                overflow:auto;
                border-top:0;
                border-left:1px solid var(--line);
            }
        }
        #bld[hidden]{
            display:none;
        }
        #bld{
            position:absolute; 
            inset:0;
            display:flex;
            gap:8px;
            padding:8px;
            background:var(--bg);
            z-index:2;
        }
        .pal{
            flex:0 0 132px;
            width:132px;
            border: 2px solid var(--line);
            border-radius:14px;
            padding:8px;
            overflow:auto;
            background:var(--panel);
        }
        .prow{
            margin-bottom:10px;
        }
        .prow b{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:13px;
            margin-bottom:4px;
        }
        .pbtn{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:4px;
        }
        .pbtn .btn{
            padding:4px 10px;
        }
        .pbtn span{
            font-weight:700;
        }
        .ic{
            display:inline-block;
            width:14px;
            height:14px;
            border-radius:50%;
        }
        .ic-nuc{
            border:2px dashed var(--nuc);
        }
        .ic-cen{
            background:#fbbf24;
        }
        .ic-chr{
            background:linear-gradient(135deg, #f472b6, #38bdf8);
        }
        .phint{
            font-size:11px;
            color:var(--muted);
            margin:6px 0 0;
            line-height:1.35;
        }
        .board{
            flex:1;
            min-width:0;
            position:relative;
            border:2px dashed var(--cellline);
            border-radius:14px;
            background:#fff;
            overflow:auto;
        }
        #world{
            position:relative;
        }
        .el.nt{
            transition:none;
        }
        .el{
            position:absolute;
            z-index:2;
            touch-action:none;
            user-select:none;
            transition:left 0.9s ease, top 0.9s ease, transform 0.4s, opacity 0.5s;
        }
        .el.nuc{
            width:96px;
            height:96px;
            border:2px dashed var(--nuc);
            border-radius:50%;
            background:rgba(2, 132, 199, 0.1);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:12px;
            font-weight:700;
            color:var(--nuc);
            cursor:grab;
        }
        .el.cen{
            width:64px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:2px;
            font-size:11px;
            cursor:grab;
        }
        .el.cen i{
            width:26px;
            height:26px;
            border-radius:50%;
            background:#fbbf24;
            box-shadow:0 0 8px #fbbf24;
        }
        .el.chr{
            line-height:0;
        }
        .el.chr .grip{
            cursor:grab;
            touch-action:none;
        }
        .el.chr input{
            width:80px;
            font:inherit;
            font-size:12px;
            text-align:center;
            border:1px solid var(--line);
            border-radius:8px;
            padding:3px;
            background:#fff;
            color:#000;
        }
        .el.cell{
            z-index:0;
            border:4px solid var(--cellline);
            border-radius:50%;
            background:var(--cell);
            cursor:grab;
        }
        .el.cell span{
            position:absolute;
            top:8px;
            left:0;
            right:0;
            text-align:center;
            font-size:11px;
            font-weight:700;
            color:var(--muted);
        }
        .ic-cell{
            border:3px solid var(--cellline);
        }
        .el.drag{
            transition:none;
            z-index:5;
            filter:drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }
        .q > label{
            display:block;
            font-size:14px;
            line-height:3;
        }
        .opts{
            display:flex;
            flex-wrap:wrap;
            gap:6px;
            margin-top:6px;
        }
        .opt{
            border: 1px solid var(--line);
            background:#fff;
            color:#000;
            border-radius:10px;
            padding:6px 10px;
            font:inherit;
            font-size:13px;
            cursor:pointer;
        }
        .opt.pick{
            border-color:#6366f1;
            background:#eef2ff;
            font-weight:700;
        }
        .el.cell.drag{
            z-index:0;
        }
        .el.sel{
            outline:2px dashed #6366f1;
            outline-offset:3px;
        }
        .grip{
            overflow:visible;
            transform-origin:50% 50%;
        }
        .board.playing .grip.ph1{
            animation:cond 1.4s ease-in-out infinite alternate;
        }
        .board.playing .mv.ph2{
            animation:tug 0.5s ease-in-out infinite alternate;
        }
        .board.playing .mv.ph3{
            animation:pull 2.4s ease-in-out infinite alternate;
        }
        .board.playing .grip.ph4{
            animation:wig 2.6s ease-in-out infinite;
        }
        .board.playing .grip.ph0 .rep{
            stroke-dasharray:100;
            animation:draw 2s ease-out infinite;
        }
        @keyframes tug{
            from{ transform:translateX(-3px)} to {transform:translateX(3px)}
        }
        @keyframes pull{
            from{ transform:translateX(0px)} to {transform:translateX(calc(var(--dir, 1) * 22px))}
        }
        .board.playing .el.nuc{
            color:transparent;
        }
        .board.playing .el.cen{
            font-size:0;
        }
        .board.playing .el.cell span{
            display:none;
        }
        .board.playing .tb{
            display:none;
        }
        .board.playing .el.sel{
            outline:none;
        }
        .board.playing .el.cen i{
            animation:glow 1.2s ease-in-out infinite alternate;
        }
        @keyframes glow{
            from{ box-shadow:0 0 4px #fbbf24;} to {box-shadow:0 0 16px 4px #fbbf24}
        }
        .board.playing .el.nuc::after{
            content:'';
            position:absolute;
            inset:-4px;
            border:2px dashed var(--nuc);
            border-radius:50%;
            animation:ring 1.8s ease-out infinite;
        }
        @keyframes ring{
            from{transform:scale(1); opacity:0.8} to {transform:scale(1.25); opacity:0}
        }
        .board.playing.p1 .el.nuc{
            animation:dissolve 2.4s ease-in-out infinite alternate;
        }
        .board.playing.p4 .el.nuc{
            animation:form 2.4s ease-in-out infinite alternate;
        }
        @keyframes dissolve{
            from{opacity:1} to {opacity:0.15}
        }
        @keyframes form{
            from{opacity:2; filter:blur(3px)} to {opacity:1; filter:none}
        }
        .board.cl .el.cell{
            border-color:transparent;
            background:transparent;
        }
        #cleave{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            pointer-events:none;
            z-index:0;
        }
        .mv, .rt{
            display:block;
            line-height:0;
        }
        .rt{
            transition:transform 0.3s;
        }
        #fib{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            pointer-events:none;
            z-index:1;
        }
        #fib line{
            stroke:#64748b;
            stroke-width:1.2;
            stroke-dasharray:5 4;
            animation:dash 0.8s linear infinite;
        }
        @keyframes dash{
            to{stroke-dashoffset:-9;}
        }
        @keyframes wig{
            0%, 100% {transform:skewX(-7deg)} 50% {transform:skewX(7deg)}
        }
        @keyframes cond{
            from{transform:scale(0.7, 1.35); opacity:0.6;} to {transform:none; opacity:1;}
        }
        @keyframes draw{
            from{ stroke-dashoffset:100;} to {stroke-dashoffset:0;}
        }
        .tb{
            position:absolute;
            z-index:6;
            display:flex;
            align-items:center;
            gap:4px;
            padding:4px 6px;
            background:#fff;
            border:1px solid var(--line);
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0, 0, 0, 0.25);
            font-size:12px;
            font-weight:600;
        }
        .tb[hidden]{
            display:none;
        }
        .tb input{
            width:96px;
            font:inherit;
            font-size:12px;
            border:1px solid var(--line);
            border-radius:8px;
            padding:3px 6px;
            color:#000;
            background:#fff;
        }
        .tb .btn{
            padding:2px 9px;
        }
        .bwrap{
            flex:1;
            min-width:0;
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .bwrap .board{
            flex:1;
            min-height:0;
        }
        .plbl{
            position:absolute;
            z-index:7;
            pointer-events:none;
            padding:3px 10px;
            border-radius: 11px;
            border:1px solid rgba(0, 0, 0, 0.25);
            font-size:12px;
            font-weight:700;
            color:#0b1020;
            white-space:nowrap;
        }
        .plbl[hidden]{
            display:none;
        }
        .hd{
            display:none;
            cursor:grab;
            touch-action:none;
        }
        .el.sel .hd{
            display:block;
        }
        .board.playing .hd{
            display:none;
        }
        #bcap{
            font-size:12px;
            font-weight:600;
            line-height:1.3;
        }
    </style>
    </head>
    <body>
        <div class="app">
            <section class="stage">
                <div class="steps" id="steps"></div>
                <main>
                    <canvas id="c"></canvas>
                    <div id="bld" hidden>
                         <div class="pal" id="pal"></div>
                         <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;">
                            <div class="board" id="board">
                                <div id="world">
                                    <svg id="cleave"></svg>
                                     <svg id="fib"></svg>
                                     
                                     <div class="tb" id="tb" hidden>
                                         <span id="tbl"></span>
                                          <input id="tbn" type="text" maxlength="14" placeholder="Name" aria-label="Chromosome Name">
                                          <button class="btn" id="tbm" title="Smaller">-</button>
                                          <span id="tbz">100%</span>
                                          <button class="btn" id="tbp" title="Larger">+</button>
                                           <button class="btn" id="tbrl" title="Rotate Left">↺</button>
                                           <button class="btn" id="tbrr" title="Rotate Right">↻</button>
                                           <button class="btn" id="tbtg" title="Random Shapes">🔄</button>
                                            <button class="btn" id="tbst" title="Straighten">|</button>
                                         </div>
                                          <div id="pLbl" hidden style="position:absolute; z-index:5; padding:2px 8px; border-radius:8px; font-size:12px; font-weight:600; color:#000; white-space:nowrap; pointer-events:none;"></div>
                                         </div>
                                        </div>
                                        <div id="bcap"></div>
                                    </div>
                                </div>
                             </main>
                             
                             <div class="ctrl">
                                 <button class="btn" id="prev">◀️</button>
                                  <button class="btn" id="play">[ ▸ ]</button>
                                  <button class="btn" id="next">▶️</button>
                                  <button class="btn" id="build">🧬</button>
                                  <span class="cnt">Chromosomes
                                    <button class="btn" id="minus">-</button><input id="cnt" type="number" min="2" max="46" inputmode="numeric" aria-label="Number of Chromosomes"><button class="btn" id="plus">+</button>
                                 </span>
                                </div>
                                <p class="hint"></p>
                            </section>
                            <aside class="box">
                                <div class="fhead"><div id="formula"></div><div id="phname"></div></div>
                                <p id="phtxt"></p>
                                <div id="qs"></div>
                                <div id="fb"><span id="fbm"></span><b id="score"></b></div>
                            </aside>
                        </div>
        
        <script>
            const $ = s => document.querySelector(s), lerp = (a,b,k) => a+(b-a)*k;
            const PH = [
                {n: 'Interphase', c:'violet', t: 'Insert simple definition here or instruction.'},
                {n: 'Prophase', c:'violet', t: 'Insert simple definition here or instruction.'},
                {n: 'Metaphase', c:'violet', t: 'Insert simple definition here or instruction.'},
                {n: 'Anaphase', c:'violet', t: 'Insert simple definition here or instruction.'},
                {n: 'Telophase', c:'violet', t: 'Insert simple definition here or instruction.'},
            ];

            const THREAD_LEN = 0.35;
            const HUE = [330, 200, 265, 155, 40], AN = [0.5, 2.4, 4.1, 1.3, 5.3], RR = [0.55, 0.75, 0.5, 0.85, 0.45], ROT = [0.6, 2.2, 1.1, 2.9, 0.2];
            let thr = 1, n = 3, phase = 0, sel = -1, timer = null, W = 0, H = 0, R = 100, cur = null, t = 0, last = performance.now();
            const cvs = $('#c'), ctx = cvs.getContext('2d');
            let build = false;

            const stepsEl = $('#steps');
            PH.forEach((p, i) => { 
                const b = document.createElement('button'); 
                b.className = 'step';
                b.style.setProperty('--c', p.c);
                b.innerHTML = '<i></i>' + p.n;b.onclick = () => setPhase(i); 
                stepsEl.appendChild(b)
            });

            function setPhase(p){
                phase = (p+5)%5;
                [...stepsEl.children].forEach((b, i) => b.classList.toggle('on', i === phase));
                showFormula();
                renderQuiz();
            }

            $('#prev').onclick = () => setPhase(phase - 1);
            $('#next').onclick = () => setPhase(phase + 1);
            $('#play').onclick = () => {
                if(build){ bplay(); return}
                if(timer){
                    clearInterval(timer);
                    timer = null;
                    $('#play').textContent = '[ ▸ ]';
                } else {
                    $('#play').textContent = '❚❚';
                    timer = setInterval(() => setPhase (phase + 1), 4200);
                }
            };

            function showFormula(){
                const N = build ? cget() : n;
                $('#formula').innerHTML = '2n = ' +N;
            };

            function setN(v){
                v = Math.round(+v);
                if(!v || v < 2) v = 2;
                n = Math.min(46, v);
                if(sel >= n) sel = -1;
                $('#cnt').value = n;
                showFormula();
                renderQuiz();
            }

            const mq = (q, a, ok, h) => ({q, a, ok, h});
            const Q = [
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + ' means ' + N + ' chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + ' means ' + N + ' chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + ' means ' + N + ' chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + ' means ' + N + ' chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + ' means ' + N + '  chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
            ];

            const ans = {}, qk = i => n + '|' +phase+ '|' + i;

            function renderQuiz(){
                if(build){ sync(); return}
                const P = PH[phase], box = $('#qs');
                $('#phname').textContent = P.n;
                $('#phname').style.color = P.c;
                $('#phtxt').textContent = P.t;
                box.innerHTML = '';

                Q[phase].forEach((q, i) => {
                    const d = document.createElement('div');
                    d.className = 'q';
                    d.innerHTML = '<div class="qr"><label for="q'+ i +'">'+ q.q +'</label><input id="q'+ i +'" inputmode="numeric" autocomplete="off" placeholder="?" maxlength="3"><span class="mark"></span></div><div class="msg"></div>';
                    
                    const inp = d.querySelector('input'), st = ans[qk(i)];
                    if(st)inp.value = st.v;
                    inp.addEventListener('input', () => {
                        inp.value = inp.value.replace(/\D/g, '');
                        grade(i, d, inp, false)
                    });
                    inp.addEventListener('change', () => grade(i, d, inp, true));
                    inp.addEventListener('keydown', e => {
                        if(e.key === 'Enter'){
                            grade(i, d, inp, true);
                            const nx = box.querySelectorAll('input')[i + 1];
                            if(nx)nx.focus()
                        }
                    });
                    box.appendChild(d);
                    paint(i, d);
                });
                summary();
            }

            function grade(i, d, inp, force){

                    const per = Math.max(1, Math.floor(R * 1.5 / 34)), col = Math.floor(j / per), row = j % per;

                        const [a, b] = sp(j, 0.6);

                    } else if(ph === 2) Lp.push({t, x : c.x + sx, y : yy});

                        const off = (ph === 3 ? 0.2 : 0.5) * R;
                        Lp.push({t, side : 0, x : c.x - off + sx, y : yy}, {t, side : 1, x : c.x + off + sx, y : yy})
                    }
                }
            }

            function setB(t, v){
                v = Math.max(0, Math.min(CAP, v));
                const rm = tt => {
                    for(let k = PB[phase].length - 1; k >= 0; k--) if(PB[phase][k].t === tt){
                        PB[phase].splice(k, 1);
                        return
                    }
                };
                while(cnt(t) < v) spawn(t);
                while(cnt(t) > v){
                    rm(t);
                    if(t === 'chr' && sided(phase)) rm(t)
                }
                sync();
            }

            function bUpdate(){
                ['cell', 'nuc', 'cen', 'chr'].forEach(t => $('#pc-' + t).textContent = cnt(t));
                if(build){
                    $('#cnt').value = cnt('chr');
                    showFormula();
                    renderMCQ();
                }
            }

            const BD = ['Interphase:', 'Prophase:', 'Metaphase:', 'Anaphase:', 'Telophase:'];
            let selKey = null, bp = false, fl = false, wl = false;
            const dims = (it, e) => {
                const ow = e.offsetWidth, oh = e.offsetHeight, a = (it.rot || 0) * Math.PI / 180, c = Math.abs(Math.cos(a)), sn = Math.abs(Math.sin(a)), s = Math.max(0.3, it.sc || 1);
                return {s, ow, oh, w : (ow * c + oh * sn) * s, h : (ow * sn + oh * c) * s};
            };

            const clampS = (it, e) => dims(it, e).s;

            function bplay(){
                if(build){ bplay(); return}
                bp = !bp;
                $('#play').textContent = bp ? '❚❚' : '[ ▸ ]';
                sync();
            }

            function fit(){
                let mx = 0, my = 0;
                Object.values(els).forEach(e => {
                    if(e.vis){
                        mx = Math.max(mx, e.vis.cx + e.vis.w / 2);
                        my = Math.max(my, e.vis.cy + e.vis.h / 2); 
                    }
                });
                world.style.width = 'max(100%, ' + Math.ceil(mx + 200) + 'px)';
                world.style.height = 'max(100%, ' + Math.ceil(my + 200) + 'px)';
            }

            function place(it, e){
                if(it.t === 'cell') e.style.width = e.style.height = CD + 'px';
                const d = dims(it, e);
                e.style.transform = 'scale(' + d.s + ')';
                e.style.left = (it.x - d.ow / 2) + 'px';
                e.style.top = (it.y - d.oh / 2) + 'px';
                const rt = e.querySelector('.rt');
                if(rt) rt.style.transform = 'rotate(' + (it.rot || 0) + 'deg)';
                e.vis = {cx : it.x, cy : it.y, w : d.w, h : d.h};
            }

            const view = () => ({x0 : board.scrollLeft - 150, x1 : board.scrollLeft + board.clientWidth + 150, y0 : board.scrollTop - 150, y1 : board.scrollTop + board.clientHeight + 150});

            function setDirs(){
                Object.values(els).filter(e => e.it && e.it.t === 'chr').forEach(e => e.style.setProperty('--dir', phase === 3 ? (e.it.side ? 1 : -1) : 1));
            }

            function drawFib(){
                const f = $('#fib');
                if(!build || !bp || !FIBP.includes(phase)){
                    if(f.firstChild) f.innerHTML = ''; 
                    return;
                }
                const bb = world.getBoundingClientRect(), v = view();
                const ctr = n => {
                    const r = n.getBoundingClientRect();
                    return [r.left + r.width / 2 - bb.left, r.top + r.height / 2 - bb.top]
                };
                const all = Object.values(els).filter(e => e.it && e.vis), cg = new Map();
                all.filter(e => e.it.t === 'cen').forEach(e => {
                    const g = grp(e.it), a = cg.get(g) || [];
                    a.push(ctr(e.querySelector('i')));
                    cg.set(g, a)
                });
                const kk = phase === 3 ? 1 : 1e9;
                let h = '';
                all.filter(e => e.it.t === 'chr').forEach(e => {
                    const X = e.it.x, Y = e.it.y;
                    if(X < v.x0 || X > v.x1 || Y < v.y0 || Y > v.y1) return;
                    const m = e.querySelector('.cm'), cs = cg.get(grp(e.it));
                    if(!m || !cs) return;
                    const [x, y] = ctr(m);
                    cs.slice().sort((a, b) => Math.hypot(a[0] - x, a[1] - y) - Math.hypot(b[0] - x, b[1] - y)).slice(0, kk).forEach(q => {
                        h += '<line x1="' + q[0] + '" y1="' + q[1] + '" x2="' + x +'" y2="' + y + '"/>'
                    });
                });
                f.innerHTML = h;
            }

            function wormLoop(){
                if(build && bp && phase === 0){
                    const tt = performance.now() / 1000;
                    Object.values(els).forEach(e => {
                        if(e.it && e.it.t === 'chr') drawThreads(e, tt)
                    });
                requestAnimationFrame(wormLoop);
                }
                 else wl = false;
            }

            function fibLoop(){
                drawFib();
                if(build && bp && phase >= 1 && phase <= 3) requestAnimationFrame(fibLoop);
                else fl = false;
            }

            let cl = false, ct0 = 0;
            const clamp01 = x => Math.max(0, Math.min(1, x)), ease = x => x * x * (3 - 2 * x), seg = (a, b, c) => ease(clamp01((a - b) / (c - b)));

            function cleaveOn(){
                return build && bp && phase === 4 && cnt('cell') > 0;
            }

            function cleaveLoop(){
                if(cleaveOn()){
                    drawCleave();
                    requestAnimationFrame(cleaveLoop);
                } else {
                    cl = false;
                    $('#cleave').innerHTML = '';
                }
            }

            function cleavePath(cx, cy, ra, rb, q, m, ax, st, circ){
                const lim = 1e9;
                const a = Math.max(4, Math.min(ra * (1 + 0.3 * q), lim)), b = rb * (1 - 0.1 * q), mp = (u, v, sg) => ax === 'x' ? [cx + sg * u, cy + v] : [cx + v, cy + sg * u];
                const f = u => 1 - q * Math.exp(- Math.pow(u / (0.3 * a), 2));
                if(n <= 0 || m < 0.002){
                    let d = '';
                    for(let i = 0; i < 220; i++){
                        const  th = i / 220 * Math.PI * 2, u = a * Math.cos(th), v = b * Math.sin(th) * f(u), [x, y] = mp(u, v, 1);
                        d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
                    }
                     return '<path d="' + d + 'Z" ' + st + '/>';
                }
                const NP = 80, gap = a * 0.05, rfa = Math.max(3, a * 0.5 - gap), rfb = circ ? rfa : b * 0.9;
                let h = '';
                [-1, 1].forEach(sg => {
                    let d = '';
                    for(let i = 0; i < NP; i++){
                        const th = -Math.PI / 2 + i / NP * Math.PI, u = a * Math.cos(th), v = b * Math.sin(th) * f(u);
                        const hx = gap * m + u , ccx = gap * m + rfa, qx = ccx + rfb * Math.cos(2 * th), qy = rfb * Math.sin(2 * th);
                        const [x, y] = mp(hx + (qx - hx) * m, v + (qy - v) * m, sg);
                        d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
                    }
                    h += '<path d="' + d + 'Z" ' + st + '/>';
                });
                return h;
            }

            function drawCleave(){
                const c = $('#cleave');
                if(!cleaveOn()){
                    c.innerHTML = '';
                    return;
                }
                const cells = Object.values(els).filter(e => e.it && e.it.t === 'cell' && e.vis);
                if(!cells.length){
                    c.innerHTML = '';
                    return;
                }
                if(!cl){
                    cl = true;
                    ct0 = performance.now();
                    requestAnimationFrame(cleaveLoop);
                }
                const tt = ((performance.now() - ct0) / 7000) % 1;
                const q = seg(tt, 0.1, 0.55) * (1 - seg(tt, 0.94, 1)), m = seg(tt, 0.55, 0.75) * (1 - seg(tt, 0.88, 0.94));
                const st = 'style="fill:var(--cell); stroke:var(--cellline); stroke-width:4; stroke-linejoin:round;"';
                let h = '';
                const vw = view();
                cells.forEach(e => {
                    const v = e.vis, cx = v.cx, cy = v.cy, rr = Math.max(v.w, v.h) * 0.75;
                    if(cx + rr < vw.x0 || cx - rr > vw.x1 || cy + rr < vw.y0 || cy - rr > vw.y1) return;
                    h += cleavePath(cx, cy, v.w / 2 - 2, v.h / 2 - 2, q, m, 'x', st, true);
                });
                c.innerHTML = h;
            }

            function posLbl(){
                const L = $('#pLbl'), e = els[selKey];

                L.textContent = names[e.k] || ('Chromosome ' + (e.k + 1));
                L.style.background = 'hsl(' + hue(e.k) + ' 80% 72%)';
                const v = e.vis, lw = L.offsetWidth, lh = L.offsetHeight;

                L.style.left = Math.max(0, Math.min(world.clientWidth - lw, v.cx - lw / 2)) + 'px';
                L.style.top = Math.max(0, Math.min(world.clientHeight - lh, y)) + 'px';
            }

            function posTb(){
                posLbl();
                const e = els[selKey], tb = $('#tb');
                if(!build || bp || !e || !e.it || !e.vis){
                    tb.hidden = true;
                    return;
                }
                const it = e.it, v = e.vis, chr = it.t === 'chr';
                tb.hidden = false;

                $('#tbl').textContent = chr ? '' : LBL[it.t];
                if(chr && document.activeElement !== $('#tbn')) $('#tbn').value = names[e.k] || '';
                $('#tbz').textContent = Math.round(clampS(it, e) * 100) + '%';
                const tw = tb.offsetWidth, th = tb.offsetHeight;
                let y = v.cy - v.h / 2 - th - 6;
                if(y < 0) y = v.cy + v.h / 2 + 6;
                tb.style.left = Math.max(0, Math.min(world.clientWidth - tw, v.cx - tw / 2)) + 'px';
                tb.style.top = Math.max(0, Math.min(world.clientHeight - th, y)) + 'px';
            }

            function refreshSel(){
                Object.values(els).forEach(e => e.classList.toggle('sel', e.key === selKey)); 
                posTb();
            }

            const shapes = {};
            function initShape(seed){
                let r = seed * 2654435761 >>> 0;
                const rnd = () => {
                    r = (r + 0x6D2B79F5) >>> 0;
                    let z = Math.imul(r ^ r >>> 15, 1 | r);
                    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
                    return ((z ^ z >>> 14) >>> 0) / 4294967296
                };
                let x = 15 + rnd() * 50, y = 15 + rnd() * 50, an = rnd() * 6.28;
                const A = [[x, y]];
                for(let i = 1; i < 9; i++){
                    an += (rnd() - 0.5) * 4;
                    const l =16 + rnd() * 22;
                    let nx = x + Math.cos(an) * l, ny = y + Math.sin(an) * l;
                    if(nx < 5 || nx > 75){
                        an = Math.PI - an;
                        nx = Math.max(5, Math.min(75, nx));
                    }
                    if(ny < 5 || ny > 75){
                        an = -an;
                        ny = Math.max(5, Math.min(75, ny));
                    }
                    x = nx;
                    y = ny;
                    A.push([x, y]);
                }
                const B = A.map(q => [Math.max(5, Math.min(75, q[0] + 5 + (rnd() - 0.5) * 18)), Math.max(5, Math.min(75, q[1] + 4 + (rnd() - 0.5) * 18))]);
                return {a : A, b : B};
            }

            function straightShape(){
                const a = [], b =[];
                for(let i = 0; i < 9; i++){
                    a.push([32, 6 + i * 8.5]);
                    b.push([48, 6 + i * 8.5])
                } 
                return {a, b}
            }

            function smoothD(P){
                let d = 'M' + P[0][0].toFixed(1) + ' ' + P[0][1].toFixed(1);
                for(let i = 0; i < P.length - 1; i++){
                    const a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], e = P[Math.min(P.length - 1, i + 2)];
                    d += 'C' + (b[0] + (c[0] - a[0]) / 6).toFixed(1) + ' ' + (b[1] + (c[1] - a[1]) / 6).toFixed(1) + ' ' + (c[0] - (e[0] - b[0]) / 6).toFixed(1) + ' ' + (c[1] - (e[1] - b[1]) / 6).toFixed(1) + ' ' + c[0].toFixed(1) + ' ' + c[1].toFixed(1);  
                }
                return d;
            }

            function threadD(P, tt, s){
                return smoothD(tt ? P.map((q, i) => [q[0] + 3.2 * Math.sin(tt * 3.2 + i * 1.1 + s), q[1] + 3.2 + Math.cos(tt * 1.7 + i * 0.9 + s * 1.7)]) : P)
            }

            function drawThreads(e, tt){
                const sh = shapes[e.k]; 
                if(!sh) return;
                ['a', 'b'].forEach((st, si) => {
                    const q = e.querySelector('path[data-st="' + st + '"]');
                    if(q) q.setAttribute('d', threadD(sh[st], tt, si * 2 + e.k))
                });
                e.querySelectorAll('circle.hd').forEach(c => {
                    const q = sh[c.dataset.st][+c.dataset.i];
                    c.setAttribute('cx', q[0]);
                    c.setAttribute('cy', q[1]);
                });
            }

            function redoThreads(e){
                e.querySelector('svg').innerHTML = chrSvg(hue(e.k), 0, 0, e.k)
            }

            function chrSvg(h, ph, sd, k){
                const a = 'hsl(' + h + ' 80% 62%)', b = 'hsl(' + h + ' 85% 74%)';
                const p = (d, c, w, x) => '<path ' + (x || '') + ' d="' + d + '" stroke="' + c + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
                const dot = (x, y) => '<circle class="cm" cx="' + x + '" cy="' + y + '" r="4.5" fill="#fde86a" stroke="#92400e" stroke-width="1.5"/>';
                return [
                    (() => {
                        const sh = shapes[k] || (shapes[k] = initShape(k + 1)), dk = 'hsl(' + h + ' 70% 38%)';
                        const hs = (st, c) => sh[st].map((q, i) => {
                            const en = i === 0 || i === sh[st].length - 1;
                            return '<circle class="hd" data-st="' + st + '" data-i="' + i + '" cx="' + q[0] +'" cy="' + q[1] + '" r="' + (en ? 5.5 : 4) + '" fill="' + (en ? c : '#fff') + '" stroke="' + dk + '" stroke-width="1.5"/>'
                        }).join('');
                        return p(smoothD(sh.a), a, 2.4, 'data-st="a"') + p(smoothD(sh.b), b, 2.4, 'class="rep"  pathLength="100" data-st="b"') + hs('b', b) + hs('a', a);
                    })(),
                    p('M11 6Q19 30 29 54', a, 6) + p('M29, 6Q21, 30, 11, 54', b, 6) + dot(20, 30),
                    p('M12 12L28 48', a, 8) + p('M28, 12L12, 48', b, 8) + dot(20, 30),
                    sd ? p('M10 10L28 30L10 50', a, 7) + dot(28, 30) : p('M30, 10L12, 30L30, 50', b, 7) + dot(12, 30),
                    p(sd ? 'M20 4C30 14 10 20 20 30S30 46 20 56' : 'M20 4C10 14 30 20 20 30S10 46 20 56', a, 4) + dot(20, 30)
                ][ph];
            }

            function mkEl(t, k){
                const e = document.createElement('div');
                e.className = 'el ' + t;
                e.style.opacity = 0;
                e.k = k;
                e.innerHTML = t === 'chr' ? '<div class="mv"><div class="rt"><svg class="grip" width="40" height="60" viewBox="0 0 40 60"></svg></div></div>' : t === 'nuc' ? 'Nucleus' : t === 'cen' ? '<i></i>Centriole' : '<span>Cell Membrane</span>';
                dragIt(e);
                return e;
            }

            function sync(){
                const seen = {}, kc = {};
                PB[phase].forEach(it => {
                    const g = it.t + (it.side ? '2' : ''), k = kc[g] = (kc[g] === undefined ? 0 : kc[g] + 1), key = g + '#' + k;
                    seen[key] = 1;
                    let e = els[key];
                    if(!e){
                        e = els[key] = mkEl(it.t, k);
                        e.key = key;
                        world.appendChild(e);
                        const tw = it.side ? els['chr#' + k] : null;
                        if(tw){
                            e.style.left = tw.style.left;
                            e.style.top = tw.style.top;
                            e.style.transform = tw.style.transform;
                            void e.offsetWidth;
                        }
                        requestAnimationFrame(() => e.style.opacity = 1);
                    }
                    e.it = it;
                    if(it.t === 'chr' && (e.ph !== phase || e.sd !== (it.side || 0))){
                        e.ph = phase;
                        e.sd = it.side || 0;
                        e.querySelector('.mv').className = 'mv ph' + phase;
                        const sv = e.querySelector('svg');
                        sv.setAttribute('class', 'grip ph' + phase);
                        sv.setAttribute('width', phase ? 40 : 80);
                        sv.setAttribute('height', phase ? 60 : 80);
                        sv.setAttribute('viewBox', phase ? '0 0 40 60' : '0 0 80 80');
                        sv.innerHTML = chrSvg(hue(k), phase, e.sd, k);
                    }
                    place(it, e);
                    if(it.t === 'chr' && phase === 0 && !bp) drawThreads(e, 0);
                });
                Object.keys(els).forEach(key => {
                    if(!seen[key]){
                        const e = els[key];
                        delete els[key];
                        e.style.opacity = 0;
                        setTimeout(() => e.remove(), 500)
                    }
                });
                if(selKey && !els[selKey]) selKey = null;
                $('#bcap').textContent = BD[phase];
                board.classList.toggle('playing', bp);
                [0, 1, 2, 3, 4].forEach(q => board.classList.toggle('p' + q, q === phase));
                board.classList.toggle('cl', cleaveOn());
                fit();
                setDirs();
                drawFib();
                drawCleave();
                if(bp && !fl && phase >= 1 && phase <= 3){
                    fl = true;
                    requestAnimationFrame(fibLoop);
                }
                if(bp && !wl && phase === 0){
                    wl = true;
                    requestAnimationFrame(wormLoop)
                }

                bUpdate();
            }

            function dragIt(e){
                e.addEventListener('pointerdown', ev => {
                    ev.preventDefault();
                    e.setPointerCapture(ev.pointerId);
                    const it = e.it, wr = world.getBoundingClientRect(), ox = it.x - (ev.clientX - wr.left), oy = it.y - (ev.clientY - wr.top), x0 = ev.clientX, y0 = ev.clientY, was = selKey === e.key; 
                    const kids = it.t === 'cell' ? Object.values(els).filter(k => k !== e && k.it && k.it.t !== 'cell' && grp(k.it) === it).map(k => ({k, dx : k.it.x - it.x, dy : k.it.y - it.y})) : [];
                    let moved = false, px = ev.clientX, py = ev.clientY, raf = 0;
                    selKey = e.key;
                    e.classList.add('drag');
                    kids.forEach(o => o.k.classList.add('nt'));
                    refreshSel();
                    const go = () => {
                        const w = world.getBoundingClientRect(), d = dims(it, e);
                        it.x = Math.max(d.w / 2, px - w.left + ox);
                        it.y = Math.max(d.h / 2, py - w.top + oy);
                        place(it, e);
                        kids.forEach(o => { o.k.it.x = it.x + o.dx; o.k.it.y = it.y + o.dy; place(o.k.it, o.k) });
                        fit();
                        posTb();
                        drawFib();
                        drawCleave();
                    };
                    const loop = () => {
                        const br = board.getBoundingClientRect();
                        let dx = 0, dy = 0;
                        if(px > br.right - 36) dx = 14;
                        else if(px < br.left + 36) dx = -14;
                        if(py > br.bottom -36) dy =14;
                        else if(py < br.top + 36) dy = -14;
                        if(moved && (dx || dy)){
                            board.scrollLeft += dx;
                            board.scrollTop += dy;
                            go();
                        }
                        raf = requestAnimationFrame(loop);
                    };
                    const mv = m => {
                        px = m.clientX;
                        py = m.clientY;
                        if(Math.abs(px - x0) + Math.abs(py - y0) > 4) moved = true;
                        if(moved) go();
                    };
                   const up = () => {
                    cancelAnimationFrame(raf);
                    e.classList.remove('drag');
                    kids.forEach(o => o.k.classList.remove('nt'));
                    e.removeEventListener('pointermove', mv);
                    e.removeEventListener('pointerup', up);
                    e.removeEventListener('pointercancel', up);
                    if(!moved && was){
                        selKey = null;
                        refreshSel()
                    }
                   };
                   e.addEventListener('pointermove', mv);
                   e.addEventListener('pointerup', up);
                   e.addEventListener('pointercancel', up);
                   raf = requestAnimationFrame(loop);
                });
            }
            board.addEventListener('pointerdown', ev => {
                const h = ev.target.closest ? ev.target.closest('.hd') : null;
                if(!h || bp) return;
                ev.preventDefault();
                ev.stopPropagation();
                h.setPointerCapture(ev.pointerId);
                const e = h.closest('.el'), sv = e.querySelector('svg'), sh = shapes[e.k], st = h.dataset.st, i = +h.dataset.i;
                const mv = m => {
                    const pt = sv.createSVGPoint();
                    pt.x = m.clientX;
                    pt.y = m.clientY;
                    const q = pt.matrixTransform(sv.getScreenCTM().inverse());
                    sh[st][i] = [Math.max(3, Math.min(77, q.x)), Math.max(3, Math.min(77, q.y))];
                    drawThreads(e, 0)
                };
                const up = () => {
                    h.removeEventListener('pointermove', mv);
                    h.removeEventListener('pointerup', up);
                    h.removeEventListener('pointercancel', up);
                };
                h.addEventListener('pointermove', mv);
                h.addEventListener('pointerup', up);
                h.addEventListener('pointercancel', up);
            }, true);
            
            $('#tbtg').onclick = () => {
                const e = els[selKey];
                if(e && e.it && e.it.t === 'chr' && phase === 0){
                    shapes[e.k] = initShape(Math.floor(Math.random() * 1e6) + 1);
                    redoThreads(e)
                }
            };

            $('#tbst').onclick = () => {
                const e = els[selKey];
                if(e && e.it && e.it.t === 'chr' && phase === 0){
                    shapes[e.k] = straightShape();
                    redoThreads(e)
                }
            };

            board.addEventListener('pointerdown', ev => {
                if(ev.target === board || ev.target === world){
                    selKey = null;
                    refreshSel()
                }
            });

            const upd = () => {
                const e = els[selKey];
                if(e && e.it){
                    place(e.it, e);
                    posTb();
                    drawFib();
                    drawCleave();
                }
            };

            const stepS = f => {
                const e = els[selKey];
                if(!e || !e.it) return;
                e.it.sc = Math.max(0.3, Math.min(4, clampS(e.it, e) * f));
                upd();
            };

            const stepR = g => {
                const e = els[selKey];
                if(!e || !e.it) return;
                e.it.rot = (((e.it.rot || 0) + g) % 360 + 360) % 360;
                upd();
            };

            $('#tbm').onclick = () => stepS(1 / 1.15);
            $('#tbp').onclick = () => stepS(1.15);
            $('#tbrl').onclick = () => stepR(-15);
            $('#tbrr').onclick = () => stepR(15);

            $('#tbn').addEventListener('input', ev => {
                const e = els[selKey];
                if(e && e.it && e.it.t === 'chr') names[e.k] = ev.target.value
            });

            new ResizeObserver(() => {
                Object.values(els).forEach(e => e.it && place(e.it, e));
                fit();
                posTb();
                drawFib();
                drawCleave();
            }).observe(board);

            $('#pal').innerHTML = ['cell', 'nuc', 'cen', 'chr'].map(t => '<div class="prow"><b><i class="ic ic-' + t + '"></i>' + LBL[t] + '</b><div class="pbtn"><button class="btn" data-t="' + t + '" data-d="-1">\u2212</button><span id="pc-' + t + '">0</span><button class="btn" data-t="' + t + '" data-d="1">+</button></div></div>').join('') + '<p class="phint">Instruction and Definitions.</p>';
            $('#pal').addEventListener('click', e => {
                const b = e.target.closest('button');
                if(b) setB(b.dataset.t, cnt(b.dataset.t) + +b.dataset.d)
            });

            $('#build').onclick = () => {
                build = !build; bp = false;
                board.classList.remove('playing');
                if(timer){
                    clearInterval(timer);
                    timer = null
                }
                $('#play').textContent = '[ ▸ ]';
                $('#bld').hidden = !build;
                cvs.style.visibility = build ? 'hidden' : 'visible';
                $('#build').textContent = build ? '🔚' : '🧬';
                $('#cnt').min = build ? 0 : 2;
                if(build){
                    renderQuiz();
                    showFormula();
                } else {
                    $('#cnt').value = n;
                    setPhase(phase);
                }
            };

            const mans = {}, bc = t => PB[phase].filter(x => x.t === t).length, chrN = () => bc('chr'), pairN = () => cnt('chr');
            const numOpts = v => {
                const c = [2 * v, v + 1, Math.max(0, v - 1), 2 * v + 1, Math.ceil(v / 2), 4 * v].filter((x, i, a) => x !== v && a.indexOf(x) === i); 
                return [v, ...c.slice(0, 3)].sort((a, b) => a - b).map(String)
            };

            const qD = (q, f, need, ok, h) => ({q, f, need, ok, h});
            const qS = (q, o, ok, h) => ({q, o, ok, h});
            const MQ = [
                [qD('How many chromosomes are in this phase?', chrN, 'chromosomes', v => 'Yes! you built ' + v + 'chromosomes, so 2n = ' + v + '.', 'Count the chromosomeson your work.')],
                [qD('How many chromosomes are in this phase?', chrN, 'chromosomes', v => 'Yes! you built ' + v + 'chromosomes, so 2n = ' + v + '.', 'Count the chromosomeson your work.')],
                [qD('How many chromosomes are in this phase?', chrN, 'chromosomes', v => 'Yes! you built ' + v + 'chromosomes, so 2n = ' + v + '.', 'Count the chromosomeson your work.')],
                [qD('How many chromosomes are in this phase?', chrN, 'chromosomes', v => 'Yes! you built ' + v + 'chromosomes, so 2n = ' + v + '.', 'Count the chromosomeson your work.')],
                [qD('How many chromosomes are in this phase?', chrN, 'chromosomes', v => 'Yes! you built ' + v + 'chromosomes, so 2n = ' + v + '.', 'Count the chromosomeson your work.')],
            ];

            function renderMCQ(){
                $('#phname').textContent = PH[phase].n + ' (build)';
                $('#phname').style.color = PH[phase].c;
                $('#phtxt').textContent = BD[phase] + ' The questions use what you built in this page.';
                const box = $('#qs');
                box.innerHTML = '';
                let got = 0, tot = 0;
                MQ[phase].forEach((m, i) => {
                    const d = document.createElement('div');
                        d.className = 'q';
                        d.innerHTML = '<label>' + (i + 1) + '. ' + m.q + '</label><div class="opts"></div><div class="msg"></div>';
                        const msg = d.querySelector('.msg'), v = m.f ? m.f() : null;
                        box.appendChild(d);
                        if(m.f && !v){
                            msg.style.color = 'var(--muted)';
                            msg.textContent = 'Build first.';
                            return;
                        }
                        const opts = m.f ? numOpts(v) : m.o.slice().sort(), right = m.f ? String(v) : m.o[0], key = phase + '|' + i, pick = mans[key];
                        tot++;
                        opts.forEach(t => {
                            const b = document.createElement('button');
                            b.className = 'opt' + (t === pick ? ' pick' : '');
                            b.textContent = t;
                            b.onclick = () => {
                                mans[key] = t;
                                renderMCQ();
                            };
                            d.querySelector('.opts').appendChild(b)
                        });
                        if(opts.includes(pick)){
                            const ok = pick === right;
                            if(ok) got++;
                            d.classList.add(ok ? 'ok' : 'bad');
                            msg.textContent = ok ? (m.f ? m.ok(v) : m.ok) : 'Not quite. ' + m.h;
                        }
                });
                const done = tot > 0 && got === tot;
                $('#fb').className = done ? 'done' : '';
                $('#fbm').textContent = tot === 0 ? 'Build this phase to unlock some questions' : done ? 'Phase complete! 🥳' : got + ' of ' + tot + 'correct.';
                $('#score').textContent = got + ' / ' + tot;
            }

         
        </script>
    </body>
</html>
