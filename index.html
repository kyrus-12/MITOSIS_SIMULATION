<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mitosis Simulation</title>
    <style>
        :root{
            --bg:#fff;
            --fg:#000;
            --muted:#333;
            --panel:#fff;
            --line:#d4d4d8;
            --cell:#f7f8fc;
            --cellline:#9aa3b8;
            --nuc:#0284c7;
            color-scheme:light;
            box-sizing:border-box;
            padding-top:env(safe-area-inset-top, 0px);
            padding-bottom:env(safe-area-inset-bottom, 0px);
        }
        html{
            height:100%;
            scroll-padding-top:env(safe-area-inset-top, 0px);
        }
        body{
            min-height:100%;
            margin:0;
            background:var(--bg);
            color:var(--fg);
            font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .app{
            display:flex;
            flex-direction:column;
            min-height:100%;
        }
        .stage{
            display:flex;
            flex-direction:column;
            flex:0 0 auto;
        }
        .steps{
            display:flex;
            gap:6px;
            padding:10px 10px 6px;
        }
        .step{
            flex:1;
            min-width:0;
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--muted);
            border-radius:12px;
            padding:8px 2px; 
            font:600 clamp(10px, 2.8vw, 14px) inherit;
            font-family:inherit;
            cursor:pointer;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:3px;
            transition:all 0.3s;
        }
        .step i{
            width:8px;
            height:8px;
            border-radius:50%;
            background:var(--c);
            opacity:0.5;
            transition:all 0.3s;
            font-style:normal;
        }
        .step.on{
            color:var(--fg);
            border-color:var(--c);
            background:color-mix(in srgb, var(--c) 20%, var(--panel));
        }
        .step.on i{
            opacity:1;
            box-shadow:0 0 10px var(--c);
            transform:scale(1.4);
        }
        main{
            height:clamp(300px, 46vh, 540px);
            position:relative;
        }
        canvas{
            position:absolute;
            inset:0;
            width:100%;
            height:100%;
            touch-action:manipulation;
        }
        .ctrl{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            align-items:center;
            gap:8px;
            padding:8px 10px 2px;
        }
        .hint{
            margin:2px 0 10px;
            text-align:center;
            font-size:12px;
            color:var(--muted);
        }
        .btn{
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--fg);
            border-radius:10px;
            padding:8px 14px;
            font:inherit;
            font-size:14px;
            cursor:pointer;
        }
        .btn:active{
            transform:scale(0.96);
        }
        .btn.main{
            background:#6366f1;
            border-color:#6366f1;
            color:#fff;
        }
        .cnt{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:13px;
            color:var(--muted);
        }
        .cnt .btn{
            padding:6px 11px;
        }
        .cnt input{
            width:60px;
            text-align:center;
            border:1px solid var(--line);
            background:var(--panel);
            color:var(--fg);
            border-radius:10px;
            padding:7px 4px;
            font:inherit;
            font-size:16px;
        }
        .box{
            padding:14px;
            border-top:1px solid var(--line);
        }
        .fhead{
            display:flex;
            align-items:baseline;
            justify-content:space-between;
            gap:10px;
        }
        #formula{
            font-weight:800;
            font-size:clamp(28px, 7vw, 38px);
            line-height:1.1;
        }
        #formula small{
            display:block;
            font-size:12px;
            font-weight:600;
            color:var(--muted);
            margin:2px;
        }
        #phname{
            font-weight:800;
            font-size:clamp(16px, 4.4vw, 20px);
        }
        #phtxt{
            font-size:13px;
            color:var(--muted);
            margin:6px 0 12px;
            line-height:1.4;
        }
        .q{
            border:1px solid var(--line);
            border-radius:12px;
            padding:8px 10px;
            margin-bottom:8px;
            transition:background 0.2s, border-color 0.2s;
        }
        .q.ok{
            border-color:green;
            background:#f0fdf4;
        }
        .q.bad{
            border-color:red;
            background:#fef2f2;
        }
        .qr{
            display:flex;
            align-items:center;
            gap:8px;
        }
        .qr label{
            flex:1;
            font-size:14px;
            line-height:1.3;
        }
        .qr input{
            width:64px;
            text-align:center;
            font:inherit;
            font-size:16px;
            font-weight:700;
            border:1px solid var(--line);
            border-radius:10px;
            padding:6px 4px;
            background:#fff;
            color:#000;
        }
        .mark{
            width:20px;
            text-align:center;
            font-weight:800;
        }
        .msg{
            display:none;
            font-size:12.5px;
            line-height:1.35;
            margin-top:6px;
        }
        .q.ok .msg{
            display:block;
            color:black;
        }
        .q.bad .msg{
            display:block;
            color:black;
        }
        #fb{
            display:flex;
            justify-content:space-between;
            gap:10px;
            font-size:14px;
            font-weight:600;
            padding:10px 12px;
            border-radius:12px;
            background:#f4f4f5;
        }
        #fb.done{
            background:#f4f4f5;
            color:black;
        }
        @media(min-width:900px){
            body{
                height:100%;
                overflow:hidden;
            }
            .app{
                flex-direction:row;
                height:100%;
            }
            .stage{
                flex:1;
                min-width:0;
            }
            main{
                flex:1;
                height:auto;
                min-height:0;
            }
            .box{
                flex:0 0 390px;
                width:390px;
                overflow:auto;
                border-top:0;
                border-left:1px solid var(--line);
            }
        }
    </style>
    </head>
    <body>
        <div class="app">
            <section class="stage">
                <div class="steps" id="steps"></div>
                <main><canvas id="c"></canvas></main>
                <div class="ctrl">
                    <button class="btn" id="prev">Back</button>
                    <button class="btn" id="play">Play</button>
                    <button class="btn" id="next">Next</button>
                    <span class="cnt">Chromosomes
                        <button class="btn" id="minus">-</button><input id="cnt" type="number" min="2" max="46" inputmode="numeric" aria-label="Number of Chromosomes"><button class="btn" id="plus">+</button>
                    </span>
                </div>
                <p class="hint"></p>
            </section>
            <aside class="box">
                <div class="fhead"><div id="formula"></div><div id="phname"></div></div>
                <p id="phtxt"></p>
                <div id="qs"></div>
                <div id="fb"><span id="fbm"></span><b id="score"></b></div>
            </aside>
        </div>
        <script>
            const $ = s => document.querySelector(s), lerp = (a,b,k) => a+(b-a)*k;
            const PH = [
                {n: 'Interphase', c:'black', t: 'M'},
                {n: 'Prophase', c:'black', t: 'N'},
                {n: 'Metaphase', c:'black', t: 'O'},
                {n: 'Anaphase', c:'black', t: 'P'},
                {n: 'Telophase', c:'black', t: 'Q'},
            ];

            const HUE = [330, 200, 265, 155, 40], AN = [0.5, 2.4, 4.1, 1.3, 5.3], RR = [0.55, 0.75, 0.5, 0.85, 0.45], ROT = [0.6, 2.2, 1.1, 2.9, 0.2];
            let n = 3, phase = 0, sel = -1, timer = null, W = 0, H = 0, R = 100, cur = null, t = 0, last = performance.now();
            const cvs = $('#c'), ctx = cvs.getContext('2d');

            const stepsEl = $('#steps');
            PH.forEach((p, i) => { 
                const b = document.createElement('button'); 
                b.className = 'step';
                b.style.setProperty('--c', p.c);
                b.innerHTML = '<i></i>' + p.n;b.onclick = () => setPhase(i); 
                stepsEl.appendChild(b)
            });

            function setPhase(p){
                phase = (p+5)%5;
                [...stepsEl.children].forEach((b, i) => b.classList.toggle('on', i === phase));
                showFormula();
                renderQuiz();
            }

            $('#prev').onclick = () => setPhase(phase - 1);
            $('#next').onclick = () => setPhase(phase + 1);
            $('#play').onclick = () => {
                if(timer){
                    clearInterval(timer);
                    timer = null;
                    $('#play').textContent = 'Play';
                } else {
                    $('#play').textContent = 'Pause';
                    timer = setInterval(() => setPhase (phase + 1), 4200);
                }
            };

            function showFormula(){
                $('#formula').innerHTML = '2n = ' +n+(phase > 2 ? '<small> each daughter cell: 2n = '+n+'</small>' : '')
            };

            function setN(v){
                v = Math.round(+v);
                if(!v || v < 2) v = 2;
                n = Math.min(46, v);
                if(sel >= n) sel = -1;
                $('#cnt').value = n;
                showFormula();
                renderQuiz();
            }

            const mq = (q, a, ok, h) => ({q, a, ok, h});
            const Q = [
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + 'means ' + N + 'chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + 'means ' + N + 'chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + 'means ' + N + 'chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + 'means ' + N + 'chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
                [mq('How many chromosomes are in the cell?', N => N, N => 'Yes! 2n = '+ N + 'means ' + N + 'chromosomes.', 'Read the formula: 2n is the total number of chromosomes.')],
            ];

            const ans = {}, qk = i => n + '|' +phase+ '|' + i;

            function renderQuiz(){
                const P = PH[phase], box = $('#qs');
                $('#phname').textContent = P.n;
                $('#phname').style.color = P.c;
                $('#phtxt').textContent = P.t;
                box.innerHTML = '';

                Q[phase].forEach((q, i) => {
                    const d = document.createElement('div');
                    d.className = 'q';
                    d.innerHTML = '<div class="qr"><label for="q'+ i +'">'+ q.q +'</label><input id="q'+ i +'" inputmode="numeric" autocomplete="off" placeholder="?" maxlength="3"><span class="mark"></span></div><div class="msg"></div>';
                    
                    const inp = d.querySelector('input'), st = ans[qk(i)];
                    if(st)inp.value = st.v;
                    inp.addEventListener('input', () => {
                        inp.value = inp.value.replace(/\D/g, '');
                        grade(i, d, inp, false)
                    });
                    inp.addEventListener('change', () => grade(i, d, inp, true));
                    inp.addEventListener('keydown', e => {
                        if(e.key === 'Enter'){
                            grade(i, d, inp, true);
                            const nx = box.querySelectorAll('input')[i + 1];
                            if(nx)nx.focus()
                        }
                    });
                    box.appendChild(d);
                    paint(i, d);
                });
                summary();
            }

            function grade(i, d, inp, force){
                const a = String(Q[phase][i].a(n)), v = inp.value;
                let ok = null;
                if(v === a)ok = true;
                else if(v !== '' && (force || v.length >= a.length)) ok = false;
                ans[qk(i)] = {v, ok};
                paint(i, d);
                summary();
            }

            function paint(i, d){
                const s = ans[qk(i)] || {}, q = Q[phase][i], m = d.querySelector('.mark');
                d.classList.toggle('ok', s.ok === true);
                d.classList.toggle('bad', s.ok === false);
                m.textContent = s.ok === true ? '✔' : s.ok === false ? '✘' : '';
                m.style.color = s.ok ? '#16a34a' : '#dc2626';
                d.querySelector('.msg').textContent = s.ok === true ? q.ok(n) : s.ok === false ? 'Not quite. '+q.h : '';
            }

            function summary(){
                let here = 0, all = 0, tot = 0;
                Q[phase].forEach((q, i) => {if((ans[qk(i)] || {}).ok) here++});
                Q.forEach((qs, p) => qs.forEach((q, i) => { tot++; if ((ans[n+'|'+p+'|'+i] || {}).ok)all++}));
                const done = here === Q[phase].length;
                $('#fb').className = done ? 'done' : '';
                $('#fbm').textContent = done ? (phase < 4 ? 'Phase complete! Try '+PH[phase + 1].n+' next. 🥹' : 'All phases done! Try another chromosome number. 🥳') : here+' of '+Q[phase].length+ ' correct. Answers are checked automatically.';
                $('#score').textContent = all + ' / '+tot;
            }

            $('#cnt').addEventListener('change', e => setN(e.target.value));

            function hold(id, d){
                const b = $(id);
                let to, iv;
                const stop = () => {
                    clearTimeout(to);
                    clearInterval(iv)
                };
                b.addEventListener('pointerdown', () => {
                    setN(n + d);
                    to = setTimeout(() => {
                        iv = setInterval (() => setN(n + d), 80)
                    }, 400)
                });
                ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop))
            }
            hold('#minus', -1);
            hold('#plus', 1);

            new ResizeObserver(() => {
                const r = cvs.parentElement.getBoundingClientRect(), d = window.devicePixelRatio || 1;
                W = r.width;
                H = r.height;
                cvs.width = W * d;
                cvs.height = H * d;
                ctx.setTransform(d, 0, 0, d, 0, 0);
                R = Math.max(40, Math.min(W/3.3, H/2.25));
            }).observe(cvs.parentElement);

            function mk(x, y, L, w, wave, ang, tx, bx){
                return{
                    x, y, L, w, wave, ang, tx, bx
                }
            }

            function scl(){
                return Math.max(0.12, Math.min(1, Math.sqrt(5/n), 4.6/(n-1)))
            }

            function hue(i){
                return i < 5 ? HUE[i] : (i * 137.508 + 20) % 360
            }

            const ang = i => ROT[i % 5] + Math.floor(i / 5) * 0.9;

            function spot(i, rmax){
                if(n <= 5) return null;
                const r = rmax * Math.sqrt((i + 0.5)/n), a = i * 2.39996;
                return[Math.cos(a) * r, Math.sin(a) * r]
            }

            function target(ph){
                const cx = W/2, cy = H/2, u = R, sc = scl(), uu = u * sc;
                const cell = [[u, u, 0], [u, u, 0], [u, u, 0], [1.28 * u, 0.96 * u, 0.1], [1.38 * u, u, 1]][ph];
                const T = {
                    a:cell[0], b:cell[1], p:cell[2], pole:[0.1, 0.8, 0.9, 0.9, 0.9][ph], spin:[0, 0.6, 1, 1, 0][ph],
                    n1:[1, 0.3, 0, 0, 1][ph], n2:ph === 4 ? 1 : 0, nOff:ph === 4 ? 0.76 * u : 0, cOff:ph === 4 ? 0.76 * u : 0.62 * u, nr:ph === 4 ? 0.38 * u : 0.64 * u, ch:[]
                };
                const minW = Math.max(2.2, 5 * sc);
                const g = Math.min(0.4 * uu, 1.6 * u/(n - 1)), cols = 1, rows = n, cgap = 0;
                for(let i = 0; i < n; i++){
                    let A, B;
                    const col = Math.floor(i/rows), inCol = col == cols - 1 ? n - col * rows : rows;
                    const gx = (col - (cols - 1)/2) * cgap, gy = ((i % rows) - (inCol - 1)/2) * g;
                    if(ph < 2){
                        const L = 0.3 * uu, s = spot(i, 0.62 * u - 0.6 * L), k = ph == 0 ? 0.42 : 0.5;
                        const px = cx + (s ? s [0] : Math.cos(AN[i]) * RR[i] * k * u), py = cy + (s ? s[1] : Math.sin(AN[i]) * RR[i] * k * u);
                        const w = ph ? Math.max(minW, 0.035 * uu) : Math.max(Math.max(1.6, 2.5 * sc), 0.016 * uu), o = ph ? 0 : 0.025 * uu, x = ph ? 0.18 * L : 0;
                        A = mk(px - o, py, L, w, ph ? 0.25 : 1, ang(i), -x, x); B = mk(px + o, py, L, w, ph ? 0.25 : 1, ang(i), x, -x); 
                    } else if(ph == 2){
                        const L = 0.28 * uu, w = Math.max(minW, 0.035 * uu);
                        A = mk(cx + gx, cy + gy, L, w, 0, 0, -0.18 * L, 0.18 * L); B = mk(cx + gx, cy + gy, L, w, 0, 0, 0.18 * L, -0.18 * L);
                    } else if(ph == 3){
                        const L = 0.28 * uu, w = Math.max(minW, 0.035 * uu);
                        A = mk(cx - 0.6 * u + gx, cy + gy * 0.9, L, w, 0, 0, 0.32 * L, 0.32 * L); B = mk(cx + 0.6 * u + gx, cy + gy * 0.9, L, w, 0, 0, -0.32 * L, -0.32 * L);
                    } else {
                        const L = 0.2 * uu, w = Math.max(Math.max(2, 3 * sc), 0.022 * uu), s = spot(i, 0.38 * u - 0.6 * L);
                        const sx = s ? s[0] : Math.cos(Math.PI * 2 * i / n) * 0.17 * u, sy = s ? s[1] : Math.sin(Math.PI * 2 * i / n) * 0.17 * u;
                        A = mk(cx - 0.76 * u + sx, cy + sy, L, w, 0.7, ang(i), 0, 0); B = mk(cx + 0.76 * u + sx, cy + sy, L, w, 0.7, ang(i), 0, 0);
                    }
                    T.ch.push([A, B]);
                }
                return T;
            }
            const SK = ['a', 'b', 'p', 'pole', 'spin', 'n1', 'n2', 'nOff', 'nr', 'cOff'], CK = ['x', 'y', 'tx', 'bx', 'L', 'w', 'wave', 'ang'];

            function cellPath(cx, cy, a, b, p){
                ctx.beginPath();
                for(let i = 0; i <= 90; i++){
                    const th = i / 90 * Math.PI * 2, s = Math.sin(th), y = b* s * (1 - p* Math.pow(Math.abs(s), 8)), x = a * Math.cos(th);
                    i ? ctx.lineTo(cx + x, cy + y) : ctx.moveTo(cx + x, cy + y);
                }
                ctx.closePath();
            }

            function drift(i, k){
                const s = phase < 2 ? 1 : 0.35;
                return[Math.sin(t * 0.9 + i * 1.7 + k * 2) * 0.012 * R * s, 
                Math.cos(t * 0.8 + 1 * 2.3 + k) * 0.012 * R * s];
            }

            function chromatid(c, i, k, hl, dim){
                const col = 'hsl(' + hue(i) + ' ' + (k ? 85 : 80 ) + '% ' +(k ? 74 : 62) + '%)', [dx, dy] = drift(i, k);
                ctx.save(); 
                ctx.globalAlpha = dim ? 0.55 : 1;
                ctx.translate(c.x + dx, c.y + dy);
                ctx.rotate(c.ang);
                const N = 22, amp = c.wave * c.L * 0.16, ph = i * 2 + k * 1.3;
                ctx.beginPath();
                for(let s = 0; s <= N; s++){
                    const q = s/N; 
                    let x, y;
                    if(q < 0.5){
                        const f = q * 2; x = lerp(c.tx, 0, f); y = lerp(-c.L / 2, 0, f)
                    } else {
                        const f = (q - 0.5) * 2; x = lerp(0, c.bx, f); y = lerp(0, c.L / 2, f)
                    }
                    const e = Math.sin(Math.PI * q);
                    x += Math.sin(q * 13 + ph + t * 2.2) * amp * e;
                    y += Math.cos(q * 9 + ph * 1.3 + t * 1.7) * amp * 0.6 * e;
                    s ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
                }
                ctx.lineCap = ctx.lineJoin = 'round';
                if(hl){
                    ctx.shadowColor = col;
                    ctx.shadowBlur = 18 + 6 * Math.sin(t * 5);
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = c.w + 4;
                    ctx.stroke();
                    ctx.shadowBlur = 0
                }
                ctx.strokeStyle = col;
                ctx.lineWidth = c.w; 
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, c.w * 0.7, 0, 7);
                ctx.fillStyle = '#fde68a';
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#92400e';
                ctx.stroke();
                ctx.restore();
            }

            function label(c, i, rad){
                const [dx, dy] = drift(i, 0), txt = 'Chromosome ' + (i + 1);
                ctx.save();
                ctx.font = '700 12px system-ui, sans-serif';
                const pw = ctx.measureText(txt).width + 16;
                const x = Math.max(pw / 2 + 4, Math.min(W - pw / 2 - 4, c.x + dx)), y = Math.max(16, c.y + dy - rad - 12);
                ctx.fillStyle = 'hsl('+ hue(i) +' 80% 58%)';
                ctx.beginPath();
                ctx.roundRect(x - pw / 2, y - 11, pw, 22, 11);
                ctx.fill();
                ctx.fillStyle = '#0b1020';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(txt, x, y + 0.5);
                ctx.restore(); 
            }

            function draw(){
                const cs = getComputedStyle(document.documentElement), g = v => cs.getPropertyValue(v).trim();
                const cx = W /2, cy = H / 2, u = R, S = cur;
                ctx.clearRect(0, 0, W, H);

                const ca = Math.max(0, Math.min(1, (S.p - 0.75) / 0.2));
                ctx.lineWidth = 3;
                if(ca < 1){
                    ctx.globalAlpha = 1 - ca;
                    cellPath(cx, cy, S.a, S.b, S.p);
                    ctx.fillStyle = g('--cell');
                    ctx.fill();
                    ctx.strokeStyle = g('--cellline');
                    ctx.stroke()
                }
                if(ca > 0){
                    ctx.globalAlpha = ca;
                    [-1, 1].forEach(sg => {
                        ctx.beginPath();
                        ctx.arc(cx + sg * S.cOff, cy, 0.6 * u, 0, 7);
                        ctx.fillStyle = g('--cell');
                        ctx.fill();
                        ctx.strokeStyle = g('--cellline');
                        ctx.stroke()
                    })
                }
                ctx.globalAlpha = 1;

                ctx.setLineDash([7, 5]);
                ctx.lineDashOffset = -t * 6;
                [[S.n1, cx - S.nOff], [S.n2, cx + S.nOff]].forEach(([al, x]) => {
                    if(al < 0.02) return;
                    ctx.globalAlpha = al;
                    ctx.beginPath();
                    ctx.arc(x, cy, S.nr, 0, 7);
                    ctx.fillStyle = g('--nuc');
                    ctx.globalAlpha = al * 0.1;
                    ctx.fill();
                    ctx.globalAlpha = al;
                    ctx.strokeStyle = g('--nuc');
                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                });
                ctx.globalAlpha = 1;
                ctx.setLineDash([]);

                const py = cy - (1 - Math.min(1, S.pole / 0.8)) * 0.78 * u, px = S.pole * S.a, pulse = 1 + 0.15 * Math.sin(t * 4);
                const poles = [[cx - px, py], [cx + px, py]];

                if(S.spin > 0.02){
                    ctx.save();
                    ctx.globalAlpha = S.spin * Math.max(0.12, Math.min(0.45, 4 / n));
                    ctx.strokeStyle = g('--fg');
                    ctx.lineWidth = 1.2;
                    ctx.setLineDash([5, 4]);
                    ctx.lineDashOffset = -t * 22;
                    S.ch.forEach((pr, i) => pr.forEach((c, k) => {
                        const [dx, dy] = drift(i, k), [ax, ay] = poles[k];
                        ctx.beginPath();
                        ctx.moveTo(ax, ay);
                        ctx.lineTo(c.x + dx, c.y + dy);
                        ctx.stroke();
                        if(phase<3){
                            const [bx, by] = poles[1 - k];
                            ctx.beginPath();
                            ctx.moveTo(bx, by);
                            ctx.lineTo(c.x + dx, c.y + dy);
                            ctx.stroke()
                        }
                    }));
                    ctx.restore();
                }
                poles.forEach(([x, y]) => {
                    ctx.beginPath();
                    ctx.arc(x, y, 0.05 * u * pulse, 0, 7);
                    ctx.fillStyle = '#fbbf24';
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = '12';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                const order = [...S.ch.keys()].filter(i => i !== sel).concat(sel >= 0 ? [sel] : []);
                order.forEach(i => S.ch[i].forEach((c, k) => chromatid(c, i, k, i === sel, sel >= 0 && i !== sel)));

                const pr = sel >= 0 ? S.ch[sel] : null, sep = pr && Math.hypot(pr[0].x - pr[1].x, pr[0].y - pr[1].y) > 0.3 * u;
                if(pr)(sep ? pr : [pr[0]]).forEach(c => {
                    const [dx, dy] = drift(sel, 0), r = Math.max(0.22 * u * scl(), 14) + Math.sin(t * 4) * 3;
                    ctx.save();
                    ctx.setLineDash([5, 5]);
                    ctx.lineDashOffset = -t * 18;
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = 'hsl(' + hue(sel) +' 90% 45%)';
                    ctx.beginPath();
                    ctx.arc(c.x + dx, c.y + dy, r, 0, 7);
                    ctx.stroke();
                    ctx.restore();
                    label(c, sel, r);
                });
            }

            function frame(now){
                const dt = Math.min(0.05, (now- last) / 1000); last = now; t += dt;
                if(W){
                    const T = target(phase), f = 1 - Math.exp(-dt * 3.5);
                    if(!cur)cur = JSON.parse(JSON.stringify(T));
                    else {
                        while(cur.ch.length > n)cur.ch.pop(); 
                        while(cur.ch.length < n)cur.ch.push(JSON.parse(JSON.stringify(T.ch[cur.ch.length])));
                        SK.forEach(k => cur[k] = lerp(cur[k], T[k], f));
                        cur.ch.forEach((pr, i) => pr.forEach((c, k) => CK.forEach(q => c[q] = lerp(c[q], T.ch[i][k][q], f))))
                    }
                    draw();
                }
                requestAnimationFrame(frame);
            }

            function hit(e){
                if(!cur)return -1;
                const r = cvs.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
                let best = -1, bd = Math.max(0.25 * R * scl(), 16);
                cur.ch.forEach((pr, i) => pr.forEach(c => {
                    const d = Math.hypot(mx - c.x, my - c.y);
                    if(d < bd){
                        bd = d; best = i
                    }
                }));
                return best;
            }

            cvs.addEventListener('pointerdown', e => {
                const i = hit(e);
                if(i >= 0)sel = (i === sel ? -1 : i)
            });

            cvs.addEventListener('pointermove', e => {
                cvs.style.cursor = hit(e) >= 0 ? 'pointer' : 'default'
            });

            setN(10);
            setPhase(0);
            requestAnimationFrame(frame);

        </script>
    </body>
</html>
